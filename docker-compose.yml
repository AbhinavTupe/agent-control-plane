services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: acp
      POSTGRES_PASSWORD: acp
      POSTGRES_DB: acp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"   # psycopg returns bytes on SQL_ASCII databases
    ports:
      - "127.0.0.1:5435:5432"   # localhost only, never expose
    volumes:
      - acp_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp -d acp"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  acp_pg:
