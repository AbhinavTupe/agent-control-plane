<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Control Plane</title>
  <style>
    :root {
      color-scheme: dark;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #10141c;
      color: #e6eaf2;
      --panel: #191f2a;
      --border: #2b3443;
      --muted: #9aa7ba;
      --accent: #82aaff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1200px; margin: 0 auto; padding: 28px 20px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    h1 { font-size: 1.65rem; margin: 0; letter-spacing: -.03em; }
    h2 { font-size: 1.1rem; margin: 0 0 14px; }
    .status-line, .counts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--muted); }
    .status-indicator { display: inline-flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #778196; }
    .dot.online { background: #55d68b; box-shadow: 0 0 10px #55d68b66; }
    .count { color: #e6eaf2; font-weight: 650; }
    section { margin-top: 26px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 12px; }
    .card, .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
    .card { padding: 16px; min-width: 0; }
    .card-top, .card-meta, .actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .agent-heading { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .agent-badge { border-radius: 999px; padding: 2px 9px; color: #b8d1ff; background: #263750; font-size: .78rem; font-weight: 700; }
    .agent-folder { overflow-wrap: anywhere; font-weight: 650; }
    .agent-state { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .85rem; text-transform: capitalize; }
    .agent-state-dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: #778196; }
    .state-waiting .agent-state-dot { background: #f3cb76; box-shadow: 0 0 9px #f3cb7666; }
    .state-active .agent-state-dot { background: #55d68b; box-shadow: 0 0 9px #55d68b66; }
    .state-idle .agent-state-dot { background: #778196; }
    .state-inactive { opacity: .58; }
    .agent-activity { display: block; min-height: 1.5em; overflow-wrap: anywhere; }
    .agent-meta { justify-content: space-between; }
    .summary { display: block; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; margin: 12px 0; }
    .card-meta { justify-content: flex-start; flex-wrap: wrap; color: var(--muted); font-size: .87rem; }
    .tool { color: #c9d5ea; font-weight: 600; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: .78rem; font-weight: 700; text-transform: uppercase; }
    .risk-low { background: #163d32; color: #7ce0b1; }
    .risk-medium { background: #493919; color: #f3cb76; }
    .risk-high { background: #4a252b; color: #ff9a9f; }
    .risk-unknown { background: #303949; color: #c4cede; }
    .decision-allowed { background: #163d32; color: #7ce0b1; }
    .decision-denied { background: #4a252b; color: #ff9a9f; }
    .similar.visible { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    .similar h3 { margin: 0 0 8px; font-size: .9rem; }
    .similar-item { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 7px; font-size: .85rem; }
    .similar-summary { flex-basis: 100%; color: #c9d5ea; overflow-wrap: anywhere; }
    .actions { margin-top: 14px; justify-content: flex-start; }
    .question-card { border-color: #7563a8; background: #1d1b2b; }
    .question-label { color: #c8b8ff; }
    .question-message { margin: 12px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .question-field { margin-top: 12px; }
    .question-field > label { display: block; margin-bottom: 6px; color: #c9d5ea; font-weight: 600; }
    .question-options { display: flex; flex-wrap: wrap; gap: 8px; }
    button.option { color: #e6eaf2; background: #35304b; }
    button.option.selected { background: #7563a8; }
    button.skip { color: #fff; background: #665c78; }
    .question-field input[type="checkbox"] { min-width: 0; flex: none; width: 18px; height: 18px; accent-color: #a894e8; }
    button { border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; color: #10141c; background: #7ce0b1; font: inherit; font-weight: 700; }
    button.deny { color: #fff; background: #bb5965; }
    button:disabled { opacity: .55; cursor: wait; }
    input { min-width: 100px; flex: 1; background: #111720; border: 1px solid var(--border); border-radius: 6px; color: inherit; padding: 7px 9px; font: inherit; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: .8rem; font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.summary-cell { min-width: 230px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .85rem; }
    .muted, .empty { color: var(--muted); }
    .empty { padding: 18px; text-align: center; }
    #error { color: #ff9a9f; min-height: 1.5em; }
    @media (max-width: 620px) {
      main { padding: 20px 12px 36px; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Agent Control Plane</h1>
      <div>
        <div class="status-line">
          <span class="status-indicator"><span id="health-dot" class="dot"></span><span id="health">Checking server…</span></span>
          <span class="counts"><span><span id="pending-count" class="count">0</span> pending</span><span><span id="agents-count" class="count">0</span> agents</span></span>
        </div>
        <div id="error" role="status" aria-live="polite"></div>
      </div>
    </header>

    <section aria-labelledby="pending-heading">
      <h2 id="pending-heading">Pending approvals</h2>
      <div id="pending-list" class="cards"><p class="empty">Loading approvals…</p></div>
    </section>

    <section aria-labelledby="recent-heading">
      <h2 id="recent-heading">Recent decisions</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Summary</th><th>Risk</th><th>Status</th><th>Decided by</th><th>Reason</th></tr></thead>
          <tbody id="recent-list"><tr><td class="empty" colspan="6">Loading decisions…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="agents-heading">
      <h2 id="agents-heading">Agents</h2>
      <div id="agents-list" class="cards"><p class="empty">Loading agents…</p></div>
    </section>
  </main>
  <script>
    const pendingList = document.getElementById("pending-list");
    const recentList = document.getElementById("recent-list");
    const agentsList = document.getElementById("agents-list");
    const errorLine = document.getElementById("error");
    const similarRequests = new Map();
    let pendingApprovalIds = new Set();
    let polling = false;
    let refreshQueued = false;
    let agentsRefreshQueued = false;
    let lastAgentsFetchAt = 0;
    let cachedAgents = null;
    let refreshDebounce;
    let eventStreamConnected = false;
    let pollTimer;

    function text(value) {
      return value == null ? "" : String(value);
    }

    function cell(row, value, className) {
      const td = document.createElement("td");
      if (className) td.className = className;
      td.textContent = text(value);
      row.appendChild(td);
      return td;
    }

    function badge(value) {
      const element = document.createElement("span");
      const risk = text(value).toLowerCase();
      element.className = "badge risk-" + (["low", "medium", "high"].includes(risk) ? risk : "unknown");
      element.textContent = text(value) || "unknown";
      return element;
    }

    function formatTime(value) {
      if (!value) return "—";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? text(value) : date.toLocaleString();
    }

    function renderPending(items) {
      document.getElementById("pending-count").textContent = String(items.length);
      document.title = (items.length ? "(" + items.length + ") " : "") + "Agent Control Plane";
      pendingApprovalIds = new Set(items.map(approval => String(approval.id)));
      pendingList.replaceChildren();
      if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No pending approvals";
        pendingList.appendChild(empty);
        return;
      }

      for (const approval of items) {
        const isQuestion = approval.tool_name === "ask_user";
        const card = document.createElement("article");
        card.className = isQuestion ? "card question-card" : "card";
        const top = document.createElement("div");
        top.className = "card-top";
        const tool = document.createElement("span");
        tool.className = isQuestion ? "tool question-label" : "tool";
        tool.textContent = isQuestion ? "Question" : text(approval.tool_name);
        top.append(tool, badge(approval.risk));
        card.appendChild(top);

        if (isQuestion) {
          renderQuestion(approval, card);
        } else {
          const summary = document.createElement("code");
          summary.className = "summary";
          summary.textContent = text(approval.summary);
          card.appendChild(summary);

          const similar = document.createElement("div");
          similar.className = "similar";
          card.appendChild(similar);
          showSimilar(approval.id, similar);
        }

        const meta = document.createElement("div");
        meta.className = "card-meta";
        const session = document.createElement("span");
        session.textContent = (text(approval.folder) || "unknown") + " · " + text(approval.session_id).slice(0, 8);
        const created = new Date(approval.created_at).getTime();
        const age = document.createElement("span");
        age.textContent = Number.isNaN(created) ? "Age unavailable" : Math.max(0, Math.floor((Date.now() - created) / 1000)) + "s ago";
        meta.append(session, age);
        card.appendChild(meta);

        if (!isQuestion) {
          const actions = document.createElement("div");
          actions.className = "actions";
          const reason = document.createElement("input");
          reason.type = "text";
          reason.placeholder = "Optional deny reason";
          reason.setAttribute("aria-label", "Optional deny reason");
          const approve = document.createElement("button");
          approve.textContent = "Approve";
          approve.addEventListener("click", () => decide(approval.id, "allow", "", actions));
          const deny = document.createElement("button");
          deny.className = "deny";
          deny.textContent = "Deny";
          deny.addEventListener("click", () => decide(approval.id, "deny", reason.value, actions));
          actions.append(reason, approve, deny);
          card.appendChild(actions);
        }
        pendingList.appendChild(card);
      }
    }

    function renderQuestion(approval, card) {
      const message = document.createElement("p");
      message.className = "question-message";
      message.textContent = text(approval.summary);
      card.appendChild(message);

      const fields = Array.isArray(approval.question_fields)
        ? approval.question_fields.map(field => ({
          name: text(field.name),
          title: text(field.title) || text(field.name),
          type: ["string", "boolean", "integer", "number"].includes(field.type) ? field.type : "string",
          options: Array.isArray(field.enum)
            ? field.enum.filter(option => ["string", "boolean", "number"].includes(typeof option))
            : []
        }))
        : [];
      if (!fields.length) fields.push({ name: "answer", title: "Answer", type: "string", options: [] });

      const controls = new Map();
      for (const field of fields) {
        const wrapper = document.createElement("div");
        wrapper.className = "question-field";
        const label = document.createElement("label");
        label.textContent = field.title;
        wrapper.appendChild(label);

        if (field.options.length) {
          const options = document.createElement("div");
          options.className = "question-options";
          const buttons = [];
          for (const option of field.options) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "option";
            button.textContent = text(option);
            button.addEventListener("click", () => {
              controls.set(field.name, { value: option });
              buttons.forEach(item => item.classList.toggle("selected", item === button));
              if (fields.length === 1) {
                void submitQuestion(approval.id, collectQuestionAnswer(fields, controls), card);
              }
            });
            buttons.push(button);
            options.appendChild(button);
          }
          wrapper.appendChild(options);
        } else if (field.type === "boolean") {
          const input = document.createElement("input");
          input.type = "checkbox";
          input.setAttribute("aria-label", field.title);
          controls.set(field.name, { input, type: field.type });
          wrapper.appendChild(input);
        } else {
          const input = document.createElement("input");
          input.type = "text";
          input.setAttribute("aria-label", field.title);
          if (field.type === "number" || field.type === "integer") input.inputMode = "decimal";
          controls.set(field.name, { input, type: field.type });
          wrapper.appendChild(input);
        }
        card.appendChild(wrapper);
      }

      const actions = document.createElement("div");
      actions.className = "actions";
      const singleEnum = fields.length === 1 && fields[0].options.length > 0;
      if (!singleEnum) {
        const submit = document.createElement("button");
        submit.textContent = "Submit";
        submit.addEventListener("click", () => {
          try {
            const answer = collectQuestionAnswer(fields, controls);
            if (!Object.keys(answer).length) throw new Error("Enter or select an answer first.");
            void submitQuestion(approval.id, answer, card);
          } catch (error) {
            errorLine.textContent = text(error.message || error);
          }
        });
        actions.appendChild(submit);
      }
      const skip = document.createElement("button");
      skip.className = "skip";
      skip.textContent = "Skip";
      skip.addEventListener("click", () => decide(approval.id, "deny", "", card));
      actions.appendChild(skip);
      card.appendChild(actions);
    }

    function collectQuestionAnswer(fields, controls) {
      const answer = {};
      for (const field of fields) {
        const control = controls.get(field.name);
        if (!control) continue;
        if (Object.prototype.hasOwnProperty.call(control, "value")) {
          answer[field.name] = control.value;
          continue;
        }
        if (field.type === "boolean") {
          answer[field.name] = control.input.checked;
          continue;
        }
        const value = control.input.value.trim();
        if (!value) continue;
        if (field.type === "integer") {
          const number = Number(value);
          if (!Number.isInteger(number)) throw new Error("Enter a whole number for " + field.title + ".");
          answer[field.name] = number;
        } else if (field.type === "number") {
          const number = Number(value);
          if (!Number.isFinite(number)) throw new Error("Enter a valid number for " + field.title + ".");
          answer[field.name] = number;
        } else {
          answer[field.name] = value;
        }
      }
      return answer;
    }

    function showSimilar(id, container) {
      const key = String(id);
      if (!similarRequests.has(key)) {
        similarRequests.set(key, loadSimilar(key));
      }
      similarRequests.get(key).then(items => {
        if (!container.isConnected || !pendingApprovalIds.has(key) || !items.length) return;
        container.classList.add("visible");
        const heading = document.createElement("h3");
        heading.textContent = "Similar past decisions";
        container.appendChild(heading);
        const grouped = new Map();
        for (const item of items) {
          const groupKey = JSON.stringify([text(item.summary), text(item.status)]);
          const existing = grouped.get(groupKey);
          if (!existing) {
            grouped.set(groupKey, { item, count: 1 });
          } else {
            existing.count++;
            const currentSimilarity = Number(existing.item.similarity);
            const nextSimilarity = Number(item.similarity);
            if (Number.isFinite(nextSimilarity) && (!Number.isFinite(currentSimilarity) || nextSimilarity > currentSimilarity)) {
              existing.item = item;
            }
          }
        }
        for (const { item, count } of grouped.values()) {
          const entry = document.createElement("div");
          entry.className = "similar-item";
          const similarity = Number(item.similarity);
          const decision = document.createElement("span");
          decision.className = "badge decision-" + (item.status === "allowed" ? "allowed" : "denied");
          decision.textContent = text(item.status).toUpperCase()
            + (Number.isFinite(similarity) ? " " + (similarity * 100).toFixed(0) + "%" : "")
            + " by " + text(item.decided_by)
            + (count > 1 ? " ×" + count : "");
          const summary = document.createElement("span");
          summary.className = "similar-summary";
          summary.textContent = text(item.summary);
          entry.append(decision, summary);
          container.appendChild(entry);
        }
      });
    }

    async function loadSimilar(key) {
      for (let retry = 0; retry <= 3; retry++) {
        if (!pendingApprovalIds.has(key)) return [];
        let items = [];
        try {
          items = await getJson("/approvals/" + encodeURIComponent(key) + "/similar");
        } catch {
          items = [];
        }
        if (items.length || retry === 3 || !pendingApprovalIds.has(key)) return items;
        await new Promise(resolve => window.setTimeout(resolve, 2000));
      }
      return [];
    }

    function renderRecent(items) {
      recentList.replaceChildren();
      if (!items.length) {
        const row = recentList.insertRow();
        cell(row, "No approvals yet", "empty").colSpan = 6;
        return;
      }
      for (const item of items) {
        const row = recentList.insertRow();
        cell(row, formatTime(item.decided_at || item.created_at));
        cell(row, item.summary, "summary-cell");
        const risk = row.insertCell();
        risk.appendChild(badge(item.risk));
        cell(row, item.status);
        cell(row, item.decided_by);
        cell(row, item.reason);
      }
    }

    function renderAgents(items) {
      document.getElementById("agents-count").textContent = String(items.length);
      agentsList.replaceChildren();
      if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No agents seen in the last 24 hours";
        agentsList.appendChild(empty);
        return;
      }
      for (const item of items) {
        const state = ["waiting", "active", "idle", "inactive"].includes(item.state) ? item.state : "inactive";
        const card = document.createElement("article");
        card.className = "card state-" + state;
        const top = document.createElement("div");
        top.className = "card-top";
        const heading = document.createElement("div");
        heading.className = "agent-heading";
        const agent = document.createElement("span");
        agent.className = "agent-badge";
        agent.textContent = text(item.agent) || "unknown";
        const folder = document.createElement("span");
        folder.className = "agent-folder";
        folder.textContent = text(item.folder) || "unknown";
        heading.append(agent, folder);
        const stateLabel = document.createElement("span");
        stateLabel.className = "agent-state";
        const dot = document.createElement("span");
        dot.className = "agent-state-dot";
        const stateText = document.createElement("span");
        stateText.textContent = state;
        stateLabel.append(dot, stateText);
        top.append(heading, stateLabel);

        const activity = document.createElement("code");
        activity.className = "summary agent-activity";
        activity.textContent = [text(item.last_tool), text(item.last_summary)].filter(Boolean).join(": ") || "No recent tool activity";

        const meta = document.createElement("div");
        meta.className = "card-meta agent-meta";
        const identity = document.createElement("span");
        identity.textContent = text(item.id).slice(0, 8);
        const seen = document.createElement("span");
        const seenAt = new Date(item.last_seen_at).getTime();
        seen.textContent = Number.isNaN(seenAt)
          ? "Seen time unavailable"
          : "Seen " + Math.max(0, Math.floor((Date.now() - seenAt) / 1000)) + "s ago";
        const pending = document.createElement("span");
        pending.textContent = String(item.pending_count) + " pending";
        meta.append(identity, seen, pending);
        card.append(top, activity, meta);
        agentsList.appendChild(card);
      }
    }

    async function getJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Request failed: " + response.status);
      return response.json();
    }

    async function decide(id, decision, reason, actions) {
      actions.querySelectorAll("button").forEach(button => { button.disabled = true; });
      errorLine.textContent = "";
      try {
        const body = { decision };
        if (decision === "deny" && reason.trim()) body.reason = reason.trim();
        const response = await fetch("/approvals/" + encodeURIComponent(id) + "/decide", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (response.status !== 409 && !response.ok) throw new Error("Decision failed: " + response.status);
        await refresh();
      } catch (error) {
        errorLine.textContent = text(error.message || error);
        actions.querySelectorAll("button").forEach(button => { button.disabled = false; });
      }
    }

    async function submitQuestion(id, answer, actions) {
      actions.querySelectorAll("button").forEach(button => { button.disabled = true; });
      errorLine.textContent = "";
      try {
        const response = await fetch("/approvals/" + encodeURIComponent(id) + "/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ answer })
        });
        if (response.status !== 409 && !response.ok) throw new Error("Answer submission failed: " + response.status);
        await refresh();
      } catch (error) {
        errorLine.textContent = text(error.message || error);
        actions.querySelectorAll("button").forEach(button => { button.disabled = false; });
      }
    }

    async function refresh(forceAgents = false) {
      if (polling) {
        refreshQueued = true;
        agentsRefreshQueued = agentsRefreshQueued || forceAgents;
        return;
      }
      polling = true;
      // This dashboard deliberately does not send ACP_TOKEN; deployments configured with it require authentication outside this page.
      try {
        const results = await Promise.allSettled([
          fetch("/healthz"),
          getJson("/approvals?status=pending"),
          getJson("/approvals?status=all&limit=20"),
          forceAgents || Date.now() - lastAgentsFetchAt >= 3000
            ? (lastAgentsFetchAt = Date.now(), getJson("/agents").then(items => {
              cachedAgents = items;
              return items;
            }))
            : Promise.resolve(cachedAgents)
        ]);
        const healthResponse = results[0];
        const healthy = healthResponse.status === "fulfilled" && healthResponse.value.ok;
        document.getElementById("health").textContent = healthy ? "Server online" : "Server unavailable";
        document.getElementById("health-dot").classList.toggle("online", healthy);

        if (results[1].status === "fulfilled") renderPending(results[1].value);
        if (results[2].status === "fulfilled") renderRecent(results[2].value);
        if (results[3].status === "fulfilled" && results[3].value) renderAgents(results[3].value);

        const failures = results.slice(1).filter(result => result.status === "rejected");
        errorLine.textContent = failures.length ? "Some dashboard data could not be refreshed." : "";
      } catch (error) {
        errorLine.textContent = text(error.message || error);
      } finally {
        polling = false;
        if (refreshQueued) {
          const forceAgents = agentsRefreshQueued;
          refreshQueued = false;
          agentsRefreshQueued = false;
          void refresh(forceAgents);
        }
      }
    }

    function updatePollingInterval() {
      if (pollTimer) window.clearInterval(pollTimer);
      pollTimer = window.setInterval(refresh, eventStreamConnected ? 15000 : 3000);
    }

    const events = new EventSource("/events");
    events.onopen = () => {
      eventStreamConnected = true;
      updatePollingInterval();
    };
    events.addEventListener("changed", () => {
      window.clearTimeout(refreshDebounce);
      refreshDebounce = window.setTimeout(() => void refresh(true), 200);
    });
    events.onerror = () => {
      eventStreamConnected = false;
      updatePollingInterval();
    };

    refresh();
    updatePollingInterval();
  </script>
</body>
</html>
